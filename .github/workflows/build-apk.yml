name: Build MaisonVie 3D - Release ARMv7

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-armv7-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK + CMake (native 3D engine)
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Restore release keystore when configured
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > hugues-release.keystore
            chmod 600 hugues-release.keystore
            echo "Release keystore restored from GitHub Secret."
          elif [ -f hugues-release.keystore ]; then
            echo "Release keystore found in repository."
          else
            echo "No release keystore configured; build cannot continue with release signing."
            exit 1
          fi

      - name: Verify signing configuration
        env:
          KEYSTORE_PASSWORD: 'Hugues@75'
          KEY_ALIAS: 'hugues'
          KEY_PASSWORD: 'Hugues@75'
        run: |
          test -f hugues-release.keystore
          keytool -list -keystore hugues-release.keystore -storepass "$KEYSTORE_PASSWORD" >/dev/null
          echo "Release keystore verified."

      - name: Build ONLY ARMv7 release APK
        env:
          KEYSTORE_PASSWORD: 'Hugues@75'
          KEY_ALIAS: 'hugues'
          KEY_PASSWORD: 'Hugues@75'
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Verify ONLY ARMv7 APK was created
        run: |
          set -euo pipefail
          APK_DIR="app/build/outputs/apk/release"
          APK=$(find "$APK_DIR" -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          COUNT=$(find "$APK_DIR" -type f -name '*.apk' | wc -l)
          test "$COUNT" -eq 1
          case "$APK" in
            *universal*) echo "Universal APK is forbidden"; exit 1;;
          esac
          echo "ARMv7 release APK: $APK"
          AAPT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/aapt"
          BADGING="$($AAPT dump badging "$APK")"
          echo "$BADGING" | grep -Eq "native-code[^\n]*armeabi-v7a"
          echo "Verified: APK contains armeabi-v7a native code."

      - name: Verify APK release signature
        run: |
          APK=$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner" verify --verbose --print-certs "$APK"

      - name: Rename ARMv7 release APK
        run: |
          APK=$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)
          cp "$APK" "MaisonVie3D-v0.6.0-armv7-release.apk"

      - name: Upload ONLY ARMv7 release APK
        uses: actions/upload-artifact@v7
        with:
          name: MaisonVie3D-v0.6.0-armv7-release
          path: MaisonVie3D-v0.6.0-armv7-release.apk
          if-no-files-found: error
          retention-days: 30

